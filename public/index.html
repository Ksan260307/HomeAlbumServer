<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
  <title>ホームアルバム</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="btn icon" id="backBtn" title="戻る" aria-label="戻る" hidden></button>
    <h1 id="title"><a class="brand" href="#/"></a></h1>
    <div id="actions" style="display:flex;gap:8px"></div>
  </header>

  <main id="main"></main>

  <div class="selbar" id="selbar" hidden>
    <span class="selcount" id="selcount">0件を選択中</span>
    <button class="btn" id="selAll">すべて選択</button>
    <button class="btn primary" id="selDownload"></button>
    <button class="btn" id="selRename" hidden>名前を変更</button>
    <button class="btn danger" id="selDelete" hidden>削除</button>
    <button class="btn" id="selCancel">やめる</button>
  </div>

  <div class="viewer" id="viewer" hidden>
    <div class="v-top">
      <button class="btn icon" id="vClose" title="閉じる" aria-label="閉じる"></button>
      <div class="v-title"><div class="fname" id="vName"></div><small id="vPos"></small></div>
      <button class="btn icon" id="vGallery" title="ここからギャラリーで見る" aria-label="ここからギャラリーで見る"></button>
      <button class="btn has-optional" id="vDownload" title="ダウンロード"></button>
      <button class="btn icon" id="vDelete" title="削除" aria-label="削除" hidden></button>
    </div>
    <button class="v-nav v-prev" id="vPrev" aria-label="前へ"></button>
    <div class="v-stage" id="vStage"></div>
    <button class="v-nav v-next" id="vNext" aria-label="次へ"></button>
  </div>

  <div class="gallery" id="gallery" hidden>
    <div class="g-layer" id="gLayer0"><div class="g-bg"></div><img alt=""></div>
    <div class="g-layer" id="gLayer1"><div class="g-bg"></div><img alt=""></div>
    <div class="g-loading" id="gLoading"><div class="spinner"></div></div>
    <div class="g-top">
      <button class="btn icon" id="gClose" title="ギャラリーを終わる" aria-label="ギャラリーを終わる"></button>
      <div class="g-caption"><div id="gWhere"></div><small id="gCount"></small></div>
    </div>
    <div class="g-bar">
      <div class="g-group">
        <button class="btn icon" id="gPrev" title="前へ" aria-label="前へ"></button>
        <button class="btn icon g-play" id="gPlay" title="再生／一時停止" aria-label="再生／一時停止"></button>
        <button class="btn icon" id="gNext" title="次へ" aria-label="次へ"></button>
      </div>
      <div class="g-group">
        <select class="select g-select" id="gInterval" aria-label="切り替えの間隔">
          <option value="3">3秒ごと</option>
          <option value="5">5秒ごと</option>
          <option value="10">10秒ごと</option>
          <option value="30">30秒ごと</option>
          <option value="60">1分ごと</option>
        </select>
        <button class="btn g-toggle" id="gShuffle" aria-pressed="false"></button>
        <button class="btn g-toggle" id="gRecursive" aria-pressed="true"></button>
        <button class="btn icon" id="gFull" title="全画面" aria-label="全画面"></button>
      </div>
    </div>
    <div class="g-progress" id="gProgress"></div>
  </div>

  <input type="file" id="uploadInput" multiple accept="image/*,video/*,.heic,.heif" hidden>
  <script src="common.js"></script>
  <script src="app.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
