<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
  <title>ホームアルバム</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script>
    // とても古いブラウザ (Fire タブレットの Silk 3 = Chrome 37 相当 など) は、見るだけのかんたん版へ切り替える
    (function () {
      var ok = true;
      try { new Function('let a = 1; const f = (x) => `${x}`; class C {} return f(a);'); } catch (e) { ok = false; }
      var css = window.CSS && window.CSS.supports;
      if (!css || !window.CSS.supports('--a', '0') || !window.CSS.supports('display', 'grid')) ok = false;
      if (!window.PointerEvent || !window.fetch || !window.Promise) ok = false;
      if (/[?&]lite=1/.test(location.search)) ok = false; // 動作確認用
      if (ok) return;
      window.__toLite = true;
      location.replace('lite' + location.hash);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <button class="btn icon" id="backBtn" title="戻る" aria-label="戻る" hidden></button>
    <h1 id="title"><a class="brand" href="#/"></a></h1>
    <div id="actions" style="display:flex;gap:8px"></div>
  </header>

  <main id="main"></main>

  <div class="selbar" id="selbar" hidden>
    <span class="selcount" id="selcount">0件を選択中</span>
    <button class="btn" id="selAll">すべて選択</button>
    <button class="btn primary" id="selDownload"></button>
    <button class="btn" id="selPrint"></button>
    <button class="btn" id="selGallery"></button>
    <button class="btn" id="selRename" hidden>名前を変更</button>
    <button class="btn danger" id="selDelete" hidden>削除</button>
    <button class="btn" id="selCancel">やめる</button>
  </div>

  <div class="viewer" id="viewer" hidden>
    <div class="v-top">
      <button class="btn icon" id="vClose" title="閉じる" aria-label="閉じる"></button>
      <div class="v-title"><div class="fname" id="vName"></div><small id="vPos"></small></div>
      <button class="btn has-optional" id="vEdit" title="編集"></button>
      <button class="btn has-optional" id="vDownload" title="ダウンロード"></button>
      <button class="btn icon" id="vMore" title="その他" aria-label="その他"></button>
    </div>
    <button class="v-nav v-prev" id="vPrev" aria-label="前へ"></button>
    <div class="v-stage" id="vStage"></div>
    <button class="v-nav v-next" id="vNext" aria-label="次へ"></button>
  </div>

  <div class="gallery" id="gallery" hidden></div>

  <div class="editor" id="editor" hidden>
    <div class="e-top">
      <button class="btn" id="eCancel">キャンセル</button>
      <div class="e-title">編集</div>
      <button class="btn" id="eReset">リセット</button>
      <button class="btn primary" id="eSave">保存</button>
    </div>
    <div class="e-stage" id="eStage">
      <div class="e-wrap" id="eWrap">
        <canvas id="eCanvas"></canvas>
        <div class="e-crop" id="eCrop" hidden>
          <div class="e-handle" data-h="nw"></div><div class="e-handle" data-h="ne"></div>
          <div class="e-handle" data-h="sw"></div><div class="e-handle" data-h="se"></div>
        </div>
      </div>
      <div class="e-loading" id="eLoading"><div class="spinner"></div></div>
    </div>
    <div class="e-bottom">
      <div class="e-panel" id="ePanel"></div>
      <div class="e-tabs" id="eTabs">
        <button data-tab="filter" type="button">フィルター</button>
        <button data-tab="adjust" type="button">調整</button>
        <button data-tab="crop" type="button">切り抜き</button>
        <button data-tab="pen" type="button">ペン</button>
        <button data-tab="stamp" type="button">スタンプ</button>
      </div>
    </div>
  </div>

  <input type="file" id="uploadInput" multiple accept="image/*,video/*,.heic,.heif" hidden>
  <div id="legacyNotice" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#fff;color:#222;padding:32px 20px;font-size:16px;line-height:1.7;overflow:auto">
    <h1 style="font-size:20px;margin:0 0 12px">このブラウザでは表示できません</h1>
    <p style="margin:0 0 12px">お使いのブラウザが古いため、ホームアルバムを表示できませんでした。</p>
    <p style="margin:0 0 12px">Fire タブレットの場合は、「設定」→「端末オプション」→「システムアップデート」で最新の状態にしてから、もう一度開いてください。</p>
    <p style="margin:0 0 12px">ほかの端末の場合は、ブラウザ（Chrome・Safari など）を最新版にしてください。</p>
    <p style="margin:0 0 4px;font-size:13px;color:#666">それでも表示できないときは、下の内容を写真に撮るなどして、管理している人に伝えてください。</p>
    <pre id="legacyInfo" style="margin:0;padding:10px;background:#f2f2f2;border-radius:6px;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-all;color:#444"></pre>
  </div>
  <script>
    window.__appOk = false;
    window.__errs = [];
    window.addEventListener('error', function (e) {
      if (e.message && window.__errs.length < 3) {
        window.__errs.push(e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')');
      }
    });
    window.addEventListener('load', function () {
      if (window.__appOk || window.__toLite) return;
      document.getElementById('legacyInfo').textContent = 'ブラウザ: ' + navigator.userAgent
        + '\n読み込み: ' + (window.__legacyJs ? '古いブラウザ用' : '通常')
        + (window.__errs.length ? '\nエラー: ' + window.__errs.join('\n') : '');
      document.getElementById('legacyNotice').style.display = 'block';
    });
  </script>
  <script src="legacy.js"></script>
  <script>
    // 新しい書き方 (?. や ?? など) が使えないブラウザでは、古いブラウザ用に直したものを読む
    (function () {
      if (window.__toLite) return;
      var modern = false;
      try {
        new Function('var o = {}; return [o?.a ?? 1_0, class { x = 1 }, async () => {}, { ...o }];');
        modern = true;
      } catch (e) { /* 古いブラウザ */ }
      if (/[?&]legacy=1/.test(location.search)) modern = false; // 動作確認用
      window.__legacyJs = !modern;
      var dir = modern ? '' : 'legacy/';
      var list = ["common.js", "app.js", "gallery.js", "editor-marks.js", "editor.js"];
      for (var i = 0; i < list.length; i++) document.write('<script src="' + dir + list[i] + '"><\/script>');
    })();
  </script>
</body>
</html>
