<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
  <title>ホームアルバム</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="btn icon" id="backBtn" title="戻る" aria-label="戻る" hidden></button>
    <h1 id="title"><a class="brand" href="#/"></a></h1>
    <div id="actions" style="display:flex;gap:8px"></div>
  </header>

  <main id="main"></main>

  <div class="selbar" id="selbar" hidden>
    <span class="selcount" id="selcount">0件を選択中</span>
    <button class="btn" id="selAll">すべて選択</button>
    <button class="btn primary" id="selDownload"></button>
    <button class="btn" id="selPrint"></button>
    <button class="btn" id="selGallery"></button>
    <button class="btn" id="selRename" hidden>名前を変更</button>
    <button class="btn danger" id="selDelete" hidden>削除</button>
    <button class="btn" id="selCancel">やめる</button>
  </div>

  <div class="viewer" id="viewer" hidden>
    <div class="v-top">
      <button class="btn icon" id="vClose" title="閉じる" aria-label="閉じる"></button>
      <div class="v-title"><div class="fname" id="vName"></div><small id="vPos"></small></div>
      <button class="btn has-optional" id="vEdit" title="編集"></button>
      <button class="btn has-optional" id="vDownload" title="ダウンロード"></button>
      <button class="btn icon" id="vMore" title="その他" aria-label="その他"></button>
    </div>
    <button class="v-nav v-prev" id="vPrev" aria-label="前へ"></button>
    <div class="v-stage" id="vStage"></div>
    <button class="v-nav v-next" id="vNext" aria-label="次へ"></button>
  </div>

  <div class="gallery" id="gallery" hidden></div>

  <div class="editor" id="editor" hidden>
    <div class="e-top">
      <button class="btn" id="eCancel">キャンセル</button>
      <div class="e-title">編集</div>
      <button class="btn" id="eReset">リセット</button>
      <button class="btn primary" id="eSave">保存</button>
    </div>
    <div class="e-stage" id="eStage">
      <div class="e-wrap" id="eWrap">
        <canvas id="eCanvas"></canvas>
        <div class="e-crop" id="eCrop" hidden>
          <div class="e-handle" data-h="nw"></div><div class="e-handle" data-h="ne"></div>
          <div class="e-handle" data-h="sw"></div><div class="e-handle" data-h="se"></div>
        </div>
      </div>
      <div class="e-loading" id="eLoading"><div class="spinner"></div></div>
    </div>
    <div class="e-bottom">
      <div class="e-panel" id="ePanel"></div>
      <div class="e-tabs" id="eTabs">
        <button data-tab="filter" type="button">フィルター</button>
        <button data-tab="adjust" type="button">調整</button>
        <button data-tab="crop" type="button">切り抜き</button>
        <button data-tab="pen" type="button">ペン</button>
        <button data-tab="stamp" type="button">スタンプ</button>
      </div>
    </div>
  </div>

  <input type="file" id="uploadInput" multiple accept="image/*,video/*,.heic,.heif" hidden>
  <script src="common.js"></script>
  <script src="app.js"></script>
  <script src="gallery.js"></script>
  <script src="editor-marks.js"></script>
  <script src="editor.js"></script>
</body>
</html>
